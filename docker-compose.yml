services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-auditiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditiq_dev}
      POSTGRES_DB:       ${POSTGRES_DB:-auditiq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data_infra/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-auditiq}:${POSTGRES_PASSWORD:-auditiq_dev}@db:5432/${POSTGRES_DB:-auditiq_db}
      APP_ENV:      ${APP_ENV:-development}
      CORS_ALLOW_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://frontend:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app/dashboard
      - /app/dashboard/node_modules

volumes:
  postgres_data:
